name: Test contact protection
on:
  pull_request:
    paths:
      - 'functions/**'
      - '.github/workflows/test-contact.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npm audit
        working-directory: functions
      - run: npm run lint
        working-directory: functions
